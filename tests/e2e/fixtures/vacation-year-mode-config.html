<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Vacation year mode fixture</title>
	<style>
		body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: #ececec; color: #222; }
		.wrap { max-width: 40rem; margin: 1.5rem auto; padding: 1rem; background: #fff; }
		fieldset { border: 1px solid #c4c4c4; border-radius: 0.375rem; padding: 0.75rem; display: flex; flex-direction: column; gap: 0.5rem; }
		.form-radio { display: flex; gap: 0.5rem; align-items: flex-start; min-height: 2.5rem; }
		.help { line-height: 1.45; margin: 0.5rem 0 0; }
		button { min-height: 2.5rem; margin-top: 1rem; }
	</style>
</head>
<body>
<div class="wrap" id="vacation-year-config">
	<h1 id="vacation-year-title">Vacation year</h1>
	<p class="help" id="vacation-year-intro">Choose calendar year or hire anniversary. Default is calendar year.</p>
	<form id="vy-form">
		<fieldset class="wtm-vacation-year-mode" aria-describedby="vacation-year-intro vacation-year-help">
			<legend>Vacation year mode</legend>
			<div class="form-radio">
				<input type="radio" id="vacationYearMode-calendar" name="vacationYearMode" value="calendar" checked>
				<label for="vacationYearMode-calendar">Calendar year (1 Jan – 31 Dec)</label>
			</div>
			<div class="form-radio">
				<input type="radio" id="vacationYearMode-anniversary" name="vacationYearMode" value="anniversary">
				<label for="vacationYearMode-anniversary">Hire anniversary (from employment start)</label>
			</div>
		</fieldset>
		<p class="help" id="vacation-year-help">Anniversary mode needs an employment start date on each employee.</p>
		<button type="submit">Save</button>
		<p id="save-status" role="status" aria-live="polite"></p>
	</form>
</div>
<script>
document.getElementById('vy-form').addEventListener('submit', (e) => {
	e.preventDefault();
	const mode = new FormData(e.target).get('vacationYearMode');
	document.getElementById('save-status').textContent = 'Saved: ' + mode;
});
</script>
</body>
</html>
