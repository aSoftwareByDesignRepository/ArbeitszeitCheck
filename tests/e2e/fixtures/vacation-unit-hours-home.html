<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Vacation unit hours home</title>
	<style>
		body { font-family: "Segoe UI", sans-serif; margin: 0; background: #f4f6f4; color: #1a1a1a; }
		main { max-width: 28rem; margin: 1.5rem auto; padding: 1.25rem; background: #fff; border: 1px solid #c8c8c8; border-radius: 8px; }
		h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
		.metric { font-size: 1.5rem; font-weight: 600; min-height: 2.75rem; }
		:focus-visible { outline: 3px solid #005fcc; outline-offset: 2px; }
	</style>
</head>
<body>
<main id="vacation-unit-home" aria-labelledby="vacation-title">
	<h1 id="vacation-title">Vacation</h1>
	<p id="vacation-metric" class="metric" data-unit="hours">196.0 of 200.0 hours left</p>
	<p id="vacation-help">Hours left this year — not days.</p>
</main>
</body>
</html>
